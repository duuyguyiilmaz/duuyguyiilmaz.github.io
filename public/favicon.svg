<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The monogram on the site's wine, in the site's cream. Solid ground rather
    than cream-on-wine outline: at 16px a hairline circle closes up into a
    smudge, while a filled disc keeps its shape at any size.
  -->
  <rect width="64" height="64" rx="16" fill="#7d4047"/>
  <text
    x="32" y="33"
    text-anchor="middle" dominant-baseline="central"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="30" font-weight="500" letter-spacing="-1"
    fill="#f1ece6"
  >DY</text>
</svg>
